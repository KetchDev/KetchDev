name: Metrics
on:
  # Runs once a day
  schedule:
    - cron: "0 6 * * *"
  # Lets you trigger it manually from the Actions tab
  workflow_dispatch:
  # Runs whenever you push to your profile repo
  push:
    branches: ["main"]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.svg
          base: header, activity, community, repositories

          # --- Full-year isometric contribution calendar ---
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # --- Languages activity, in-depth (clones & analyzes repos) ---
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_indepth: yes
          plugin_languages_details: lines-mapping, bytes-mapping, percentage
          plugin_languages_limit: 8
          plugin_languages_threshold: 0%
          plugin_languages_skipped: KetchDev/coming-soon, KetchDev/sitoPersonale-particles-

          # --- Achievements, compact display ---
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: C

          # --- Recently listened (Spotify) ---
          plugin_music: yes
          plugin_music_provider: spotify
          plugin_music_mode: recent
          plugin_music_limit: 4
          plugin_music_played_at: yes
          plugin_music_token: "${{ secrets.SPOTIFY_CLIENT_ID }}, ${{ secrets.SPOTIFY_CLIENT_SECRET }}, ${{ secrets.SPOTIFY_REFRESH_TOKEN }}"
