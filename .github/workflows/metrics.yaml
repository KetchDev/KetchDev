name: Metrics
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # --- Left column: base info (header, activity, community, repos) ---
      - name: Base info
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics-base.svg
          base: header, activity, community, repositories

      # --- Right column: isometric contribution calendar ---
      - name: Contribution calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics-calendar.svg
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      # --- Full-width: languages ---
      - name: Languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics-languages.svg
          base: ""
          plugin_languages: yes
          plugin_languages_indepth: no
          plugin_languages_limit: 8
          plugin_languages_threshold: 0%
          plugin_languages_skipped: ketchdev/coming-soon,ketchdev/sitopersonale-particles-
          extras_css: |
            h2 { display: none !important; }
